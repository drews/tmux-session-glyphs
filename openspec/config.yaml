schema: spec-driven

context: |
  Vision, design pillars, anti-goals: see openspec/project.md
  Behavior contract: see openspec/specs/glyph-rendering.md

  Tech stack: bash, tmux CLI; jq optional (identity file accelerator)
  Entry point: bin/tmux-session-glyphs (single script)
  TPM entry: session_glyphs.tmux (exposes @tsg_script)
  Performance budget: <50ms wall-clock per render

  Config precedence (high → low):
    env TSG_* > tmux @tsg_* options > ~/.config/tmux-session-glyphs.conf > config/glyphs.conf

  Output contract (non-negotiable):
    #[range=user|<sess>]...#[norange] per glyph — enables click-to-switch

  Integration: read-only against drews/dotfiles session management
    (session-emoji, resurrect). Never creates, renames, or kills sessions.

  Testing: shellcheck --severity=warning; snapshot tests planned with mocked tmux

rules:
  proposal:
    - Keep proposals concise — this is a small shell utility
    - Check the proposal against design pillars in openspec/project.md
    - Always consider performance impact (<50ms budget)
  tasks:
    - Prefer minimal, incremental changes over large rewrites
    - Shell scripts must pass shellcheck --severity=warning
    - The script must always exit 0; status-line failures are UX bugs
    - Preserve the #[range=user|...] output contract on every glyph
